<!DOCTYPE html>
<html lang="id">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peta Modis - Stock Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@700;800;900&family=JetBrains+Mono:wght@700&display=swap');
        
        :root {
            --bg-body: #0d0707; 
            --text-main: #ffffff;
            --text-sub: #fca5a5; 
            --accent-color: #ef4444; 
            --title-shadow: rgba(239, 68, 68, 0.4);
            --glow-color: rgba(239, 68, 68, 0.2);
        }

        .light-mode {
            --bg-body: #f8fafc;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --accent-color: #6366f1; 
            --title-shadow: rgba(99, 102, 241, 0.3);
            --glow-color: rgba(99, 102, 241, 0.1);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            transition: background 1.5s cubic-bezier(0.4, 0, 0.2, 1), color 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, var(--glow-color) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, var(--glow-color) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .notion-cover { height: 160px; width: 100%; background: #000 url('./hollow_purple.gif') center/cover no-repeat; border-bottom: 3px solid #6366f1; position: relative; }
        .notion-cover::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, var(--bg-body) 100%); }

        body:not(.light-mode) .notion-cover { background-image: url('./sukuna_cover.gif'); border-bottom: 3px solid #ef4444; }

        .main-content { max-width: 850px; margin: 0 auto; padding: 10px 20px 100px; position: relative; z-index: 10; }
        .page-title { font-family: 'Poppins', sans-serif; font-size: 36px; font-weight: 900; color: var(--text-main); letter-spacing: -1px; text-shadow: 0 0 30px var(--title-shadow); transition: color 1.5s ease; }

        .curse-card { 
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 24px; 
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            transition: all 0.5s ease;
        }

        body:not(.light-mode) .curse-card {
            background: linear-gradient(135deg, rgba(45, 10, 10, 0.4) 0%, rgba(10, 5, 5, 0.6) 100%);
            border: 1px solid rgba(239, 68, 68, 0.15);
        }

        body.light-mode .curse-card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .corner-decor { position: absolute; width: 12px; height: 12px; border: 2px solid var(--accent-color); opacity: 0.7; }
        .top-left { top: 15px; left: 15px; border-right: 0; border-bottom: 0; }
        .top-right { top: 15px; right: 15px; border-left: 0; border-bottom: 0; }

        .curse-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        .curse-table th { color: var(--text-sub); font-weight: 800; text-transform: uppercase; font-size: 10px; letter-spacing: 0.15em; padding: 12px; text-align: left; border-bottom: 2px solid var(--accent-color); opacity: 0.8; }
        .curse-table td { padding: 14px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); vertical-align: middle; }
        body.light-mode .curse-table td { border-bottom: 1px solid #f1f5f9; }
        .curse-table tr:hover td { background-color: rgba(255, 255, 255, 0.02); }
        body.light-mode .curse-table tr:hover td { background-color: #f8fafc; }

        .status-badge { font-size: 9px; font-weight: 900; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; letter-spacing: 0.05em; font-family: 'JetBrains Mono', monospace; }
        .status-danger { background: rgba(239, 68, 68, 0.15); color: #ff6b6b; border: 1px solid rgba(239, 68, 68, 0.3); text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        .status-warning { background: rgba(245, 158, 11, 0.15); color: #fcc419; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-safe { background: rgba(34, 197, 94, 0.15); color: #51cf66; border: 1px solid rgba(34, 197, 94, 0.3); }
        
        .btn-delete { color: #ef4444; opacity: 0.5; transition: all 0.3s; cursor: pointer; }
        .btn-delete:hover { opacity: 1; transform: scale(1.1); }
    </style>
</head>
<body class="dark-mode" id="bodyTag">

    <audio id="sfxClick" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" type="audio/mpeg"></audio>
    <div class="notion-cover"></div>

    <div class="main-content">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <span class="text-[9px] font-black bg-[var(--accent-color)] text-white px-2.5 py-1 rounded-sm tracking-wider uppercase transition-colors duration-[1500ms]">RADAR AKTIF</span>
            </div>
            <a href="index.html" onclick="playSfx()" class="text-[10px] font-bold text-slate-400 hover:text-[var(--accent-color)] transition uppercase tracking-widest">← Kembali ke Input</a>
        </div>
        
        <div class="flex justify-between items-end mb-10">
            <h1 class="page-title">Peta Radar Modis</h1>
            <button onclick="resetAll()" class="mb-2 text-[9px] font-bold text-red-500/70 hover:text-red-500 border border-red-500/30 px-3 py-1.5 rounded-sm transition-all uppercase tracking-widest bg-red-500/5 hover:bg-red-500/10">
                Reset All History
            </button>
        </div>

        <div id="modis-container" class="space-y-10"></div>

        <div class="pt-20 pb-10 flex flex-col items-center">
            <div class="w-10 h-1px bg-[var(--accent-color)] opacity-50 mb-4 transition-colors duration-[1500ms]"></div>
            <p class="text-center text-[9px] text-slate-600 font-mono tracking-[0.5em] uppercase">Sorcery Fight // Area Scanning System</p>
        </div>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('notion_gojo_pro_db')) || [];
        function playSfx() { document.getElementById('sfxClick').play().catch(() => {}); }

        const currentTheme = localStorage.getItem('theme') || 'dark';
        if(currentTheme === 'light') {
            document.getElementById('bodyTag').classList.add('light-mode');
        }

        function deleteItem(id) {
            if(confirm("Musnahkan data ini dari radar?")) {
                playSfx();
                items = items.filter(item => {
                    if (item.timestamp) {
                        return item.timestamp !== id;
                    } else {
                        return item.name !== id;
                    }
                });
                localStorage.setItem('notion_gojo_pro_db', JSON.stringify(items));
                render();
            }
        }

        function resetAll() {
            if(confirm("PERINGATAN: Hapus seluruh histori pemindaian?")) {
                playSfx();
                items = [];
                localStorage.removeItem('notion_gojo_pro_db');
                render();
            }
        }

        function render() {
            const container = document.getElementById('modis-container');
            container.innerHTML = "";
            
            const today = new Date(); 
            today.setHours(0,0,0,0);
            
            const uniqueModis = [...new Set(items.map(item => item.modis).filter(Boolean))];
            uniqueModis.sort((a, b) => parseInt(a) - parseInt(b));

            if(uniqueModis.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-16 font-mono text-[10px] tracking-[0.5em] curse-card uppercase">Radar Bersih // Tidak ada data kutukan</div>`;
                return;
            }

            uniqueModis.forEach(modisNum => {
                const modisItems = items.filter(item => item.modis === modisNum);
                modisItems.sort((a, b) => new Date(a.exp) - new Date(b.exp));
                
                let isDanger = false;
                modisItems.forEach(item => {
                    const itemDate = new Date(item.exp);
                    itemDate.setHours(0,0,0,0);
                    const diffDays = Math.round((itemDate - today) / 86400000);
                    if(diffDays <= 0) isDanger = true;
                });

                let sectionHTML = `
                    <div class="curse-card ${isDanger ? 'border-red-600/50' : ''}">
                        <div class="corner-decor top-left"></div>
                        <div class="corner-decor top-right"></div>
                        <div class="flex justify-between items-center mb-5 pb-3 border-b border-dashed border-[var(--accent-color)] border-opacity-30">
                            <div>
                                <h2 class="font-900 italic text-xl tracking-tight uppercase ${isDanger ? 'text-red-500' : 'text-[var(--text-main)]'}">MODIS ${modisNum}</h2>
                                <p class="text-[10px] text-slate-500 font-mono mt-0.5">${modisItems.length} Terdata di Lorong</p>
                            </div>
                            ${isDanger ? '<span class="text-[9px] font-extrabold text-red-500 animate-pulse tracking-wider border border-red-500 px-2 py-0.5">TERDETEKSI</span>' : ''}
                        </div>
                        <div class="overflow-x-auto">
                            <table class="curse-table">
                                <thead>
                                    <tr>
                                        <th>Target Barang</th>
                                        <th>Qty</th>
                                        <th>Batas Exp</th>
                                        <th>Status</th>
                                        <th class="text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                modisItems.forEach(item => {
                    const itemDate = new Date(item.exp);
                    itemDate.setHours(0,0,0,0);
                    const diffDays = Math.round((itemDate - today) / 86400000);
                    
                    let badgeClass = "status-safe", s = "AMAN";
                    if(diffDays < 0) { badgeClass = "status-danger"; s = "EXPIRED"; }
                    else if(diffDays === 0) { badgeClass = "status-danger"; s = "EXPIRED"; }
                    else if(diffDays === 1) { badgeClass = "status-danger"; s = "H-1"; }
                    else if(diffDays <= 3) { badgeClass = "status-danger"; s = `H-${diffDays}`; }
                    else if(diffDays <= 30) { badgeClass = "status-warning"; s = "MEPET"; }

                    const deleteKey = item.timestamp ? item.timestamp : `'${item.name}'`;

                    sectionHTML += `
                        <tr>
                            <td class="font-bold italic text-sm uppercase tracking-tight text-[var(--text-main)]">${item.name}</td>
                            <td class="font-bold text-xs font-mono text-[var(--text-sub)]">${item.qty || '-'} PCS</td>
                            <td class="text-xs font-mono text-[var(--text-sub)]">${item.exp}</td>
                            <td><span class="status-badge ${badgeClass}">${s}</span></td>
                            <td class="text-center">
                                <button onclick="deleteItem(${deleteKey})" class="btn-delete">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                </button>
                            </td>
                        </tr>
                    `;
                });

                sectionHTML += `</tbody></table></div></div>`;
                container.insertAdjacentHTML('beforeend', sectionHTML);
            });
        }
        render();
    </script>
</body>
</html>
